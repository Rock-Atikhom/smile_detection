# Smart Smile Capture — local MVP configuration

[camera]
# Zero selects the MacBook's built-in/default camera.
index = 0

[vision]
# Paths are resolved relative to this configuration file.
model_path = "models/face_landmarker.task"

[storage]
output_dir = "output"

[logging]
directory = "logs"
level = "INFO"

[timing]
# Preview stays active, but Participant evidence cannot advance during warm-up.
camera_warmup_seconds = 2.0

[ui]
debug = false
