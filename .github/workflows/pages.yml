name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node 22.22.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install exact npm runtime
        run: npm install --global npm@10.9.7

      - name: Install locked web dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Verify vendored vision release
        run: npm run web:vision:check

      - name: Test Apps Script JPEG handling
        run: npm run apps-script:test

      - name: Check web formatting
        run: npm run web:format:check

      - name: Check Pages workflow formatting
        run: npx prettier --check .github/workflows/pages.yml

      - name: Run web lint checks
        run: npm run web:lint

      - name: Run web type checks
        run: npm run web:typecheck

      - name: Run web unit and component tests
        run: npm run web:test

      - name: Build the web application
        run: npm run web:build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SMART_SMILE_EMAIL_MODE: ${{ vars.SMART_SMILE_EMAIL_MODE || 'mock' }}
          VITE_SMART_SMILE_EMAIL_ENDPOINT: ${{ vars.SMART_SMILE_EMAIL_ENDPOINT }}

      - name: Archive GitHub Pages artifact
        run: >-
          tar --dereference --hard-dereference
          --directory apps/web/dist
          -cvf "${RUNNER_TEMP}/artifact.tar"
          --exclude=.git
          --exclude=.github
          --exclude=".[^/]*"
          .

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Publish GitHub Pages site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
