name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked web dependencies
        run: npm ci

      - name: Check web formatting
        run: npm run web:format:check

      - name: Run web lint checks
        run: npm run web:lint

      - name: Run web type checks
        run: npm run web:typecheck

      - name: Run web unit and component tests
        run: npm run web:test

      - name: Build the web application
        run: npm run web:build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production-preview browser tests
        run: npm run web:e2e

  macos-arm64:
    name: macOS ARM64 / Python 3.12.10
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install exact Python runtime
        run: uv python install 3.12.10

      - name: Synchronize locked environment
        run: make python-sync

      - name: Run tests
        run: make python-test

      - name: Check formatting
        run: make python-format-check

      - name: Run lint checks
        run: make python-lint

      - name: Run type checks
        run: make python-mypy
