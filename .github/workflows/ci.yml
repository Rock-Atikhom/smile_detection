name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web / Node 22.22.2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node 22.22.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install exact npm runtime
        run: npm install --global npm@10.9.7

      - name: Install locked web dependencies
        run: npm ci

      - name: Verify vendored vision release
        run: npm run web:vision:check

      - name: Check web formatting
        run: npm run web:format:check

      - name: Run web lint checks
        run: npm run web:lint

      - name: Run web type checks
        run: npm run web:typecheck

      - name: Run web unit and component tests
        run: npm run web:test

      - name: Build the web application
        run: npm run web:build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production-preview browser tests
        run: npm run web:e2e

      - name: Preserve the validated Pages bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smart-smile-pages
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  macos-arm64:
    name: macOS ARM64 / Python 3.12.10
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install exact Python runtime
        run: uv python install 3.12.10

      - name: Synchronize locked environment
        run: make python-sync

      - name: Run tests
        run: make python-test

      - name: Check formatting
        run: make python-format-check

      - name: Run lint checks
        run: make python-lint

      - name: Run type checks
        run: make python-mypy

  deploy-preview-pages:
    name: Deploy / Cloudflare Pages (development preview)
    if: >-
      vars.CLOUDFLARE_PAGES_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node 22.22.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install exact npm runtime
        run: npm install --global npm@10.9.7

      - name: Install locked web dependencies
        run: npm ci

      - name: Verify vendored vision release
        run: npm run web:vision:check

      - name: Check web formatting
        run: npm run web:format:check

      - name: Run web lint checks
        run: npm run web:lint

      - name: Run web type checks
        run: npm run web:typecheck

      - name: Run web unit and component tests
        run: npm run web:test

      - name: Build the web application
        run: npm run web:build

      - name: Deploy development preview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.115.0
          command: >-
            pages deploy apps/web/dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.head_ref }}
            --commit-hash=${{ github.event.pull_request.head.sha }}

  deploy-pages:
    name: Deploy / Cloudflare Pages
    needs: [web, macos-arm64]
    if: >-
      vars.CLOUDFLARE_PAGES_DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Download the validated Pages bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smart-smile-pages
          path: apps/web/dist

      - name: Deploy the validated bundle
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.115.0
          command: >-
            pages deploy apps/web/dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
